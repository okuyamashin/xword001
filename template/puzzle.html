<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #fff;
    --fg: #222;
    --muted: #666;
    --line: #333;
    --block: transparent;
    --cell: #fff;
    --word: #fff3b0;
    --active: #ffd23f;
    --wrong: #ffb3b3;
    --revealed: #2a6fdb;
    --accent: #2a6fdb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .theme { color: var(--muted); margin: 0 0 12px; }
  .layout { display: grid; gap: 16px; }
  @media (min-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr) 320px; } }

  .board {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    width: min(100%, 520px);
    aspect-ratio: var(--cols) / var(--rows);
    user-select: none;
  }
  .cell {
    position: relative;
    border: 1px solid var(--line);
    margin: 0 -1px -1px 0;
    background: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(14px, 5vw, 26px);
    cursor: pointer;
  }
  .cell.block { border-color: transparent; background: var(--block); cursor: default; }
  .cell .num { position: absolute; top: 1px; left: 3px; font-size: clamp(8px, 2.2vw, 11px); line-height: 1; color: var(--muted); }
  .cell.in-word { background: var(--word); }
  .cell.active { background: var(--active); }
  .cell.wrong { background: var(--wrong); }
  .cell.revealed { color: var(--revealed); }

  .entry { margin-top: 12px; width: min(100%, 520px); }
  .current { min-height: 3em; margin: 0 0 8px; }
  .current .label { font-weight: bold; }
  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; min-width: 0; font-size: 1.1rem; padding: 8px; }
  button { font-size: 1rem; padding: 8px 12px; cursor: pointer; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .message { min-height: 1.5em; margin: 8px 0 0; color: var(--accent); font-weight: bold; }

  .clues h2 { font-size: 1rem; margin: 0 0 4px; }
  .clues ol { list-style: none; padding: 0; margin: 0 0 16px; }
  .clues li { padding: 4px 6px; cursor: pointer; border-radius: 4px; }
  .clues li.selected { background: var(--word); }
  .clues li.done { color: var(--muted); }
  .clues li .n { font-weight: bold; margin-right: 4px; }
  .clues li .ans { color: var(--revealed); margin-left: 4px; }

  .rules { margin-top: 16px; font-size: 0.9rem; color: var(--muted); }
  .rules ul { padding-left: 1.2em; margin: 4px 0; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="theme" id="theme"></p>
  <div class="layout">
    <section>
      <div class="board" id="board"></div>
      <div class="entry">
        <p class="current" id="current">カギを選んでください。</p>
        <form class="input-row" id="form" autocomplete="off">
          <input id="answer" type="text" inputmode="text" placeholder="答えを入力" aria-label="答え">
          <button type="submit">入れる</button>
        </form>
        <div class="buttons">
          <button type="button" id="check">答え合わせ</button>
          <button type="button" id="reveal-word">この答えを見る</button>
          <button type="button" id="reveal-all">全部の答えを見る</button>
          <button type="button" id="reset">リセット</button>
        </div>
        <p class="message" id="message" role="status"></p>
      </div>
    </section>
    <section class="clues">
      <h2 id="across-label"></h2>
      <ol id="across"></ol>
      <h2 id="down-label"></h2>
      <ol id="down"></ol>
    </section>
  </div>
  <section class="rules">
    <strong>答えの書き方</strong>
    <ul id="rules"></ul>
  </section>
</main>

<script>
// ---- 言語ごとの設定（generator/locales/<locale>.js を埋め込む） ----
/*__LOCALE__*/

// ---- パズル ----
const PUZZLE = /*__PUZZLE__*/null;

// ---- 状態 ----
const { rows, cols } = PUZZLE.size;
const solution = PUZZLE.grid.map((row) => [...row]);
const words = PUZZLE.words.map((w, i) => ({ ...w, index: i, cells: cellsOf(w) }));
const storageKey = `xword:${PUZZLE.id}`;
let filled = emptyGrid();
let revealed = emptyGrid(false);
let shownWords = []; // 答えを見た単語の index
let selected = null;
let activeCell = null;

function emptyGrid(value = '') {
  return Array.from({ length: rows }, () => Array(cols).fill(value));
}
function cellsOf(w) {
  const [dr, dc] = w.direction === 'across' ? [0, 1] : [1, 0];
  return [...w.answer].map((_, i) => [w.row + dr * i, w.col + dc * i]);
}
function wordsAt(r, c) {
  return words.filter((w) => w.cells.some(([wr, wc]) => wr === r && wc === c));
}

// ---- 保存 ----
function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify({ filled, revealed, shownWords }));
  } catch {}
}
function load() {
  try {
    const data = JSON.parse(localStorage.getItem(storageKey) ?? 'null');
    if (data?.filled?.length === rows) {
      filled = data.filled;
      revealed = data.revealed;
      shownWords = data.shownWords ?? [];
    }
  } catch {}
}

// ---- 描画 ----
const board = document.getElementById('board');
const cellEls = emptyGrid(null);

function buildBoard() {
  board.style.setProperty('--rows', rows);
  board.style.setProperty('--cols', cols);
  const numbers = new Map(words.map((w) => [`${w.row},${w.col}`, w.number]));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const el = document.createElement('div');
      el.className = 'cell';
      if (solution[r][c] === '#') {
        el.classList.add('block');
      } else {
        const num = numbers.get(`${r},${c}`);
        if (num) el.innerHTML = `<span class="num">${num}</span>`;
        el.append(document.createElement('span'));
        el.addEventListener('click', () => onCellClick(r, c));
      }
      board.append(el);
      cellEls[r][c] = el;
    }
  }
}

function buildClues() {
  document.getElementById('across-label').textContent = labels.across;
  document.getElementById('down-label').textContent = labels.down;
  for (const w of words) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${w.number}</span><span class="text"></span><span class="ans"></span>`;
    li.querySelector('.text').textContent = w.clue ?? '（カギなし）';
    li.addEventListener('click', () => select(w));
    document.getElementById(w.direction).append(li);
    w.li = li;
  }
}

function render() {
  const selectedCells = new Set(selected?.cells.map(([r, c]) => `${r},${c}`));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (solution[r][c] === '#') continue;
      const el = cellEls[r][c];
      el.lastChild.textContent = filled[r][c];
      el.classList.toggle('in-word', selectedCells.has(`${r},${c}`));
      el.classList.toggle('active', activeCell?.[0] === r && activeCell?.[1] === c);
      el.classList.toggle('revealed', revealed[r][c]);
    }
  }
  for (const w of words) {
    w.li.classList.toggle('selected', w === selected);
    const complete = w.cells.every(([r, c]) => filled[r][c]);
    w.li.classList.toggle('done', complete);
    const shown = shownWords.includes(w.index);
    w.li.querySelector('.ans').textContent = shown ? `→ ${w.display}` : '';
  }
  const current = document.getElementById('current');
  if (selected) {
    current.innerHTML = '<span class="label"></span> <span class="text"></span>';
    current.querySelector('.label').textContent = `${labels[selected.direction]}${selected.number}（${selected.cells.length}文字）`;
    current.querySelector('.text').textContent = selected.clue ?? '';
  }
}

// ---- 操作 ----
function select(w, cell = null) {
  selected = w;
  activeCell = cell ?? w.cells[0];
  clearWrong();
  setMessage('');
  render();
  const input = document.getElementById('answer');
  input.value = w.cells.map(([r, c]) => filled[r][c] || '').join('');
  input.focus();
  input.select();
}

function onCellClick(r, c) {
  const candidates = wordsAt(r, c);
  if (!candidates.length) return;
  // 同じマスをもう一度押したら、タテとヨコを切り替える
  const sameCell = activeCell?.[0] === r && activeCell?.[1] === c;
  let next = candidates[0];
  if (sameCell && selected && candidates.length > 1) {
    next = candidates.find((w) => w !== selected) ?? next;
  } else if (selected && candidates.includes(selected)) {
    next = selected;
  }
  select(next, [r, c]);
}

function enter(text) {
  if (!selected) return setMessage('先にカギを選んでください。');
  const letters = [...normalize(text)];
  const invalid = letters.filter((ch) => !isValidAnswer(ch));
  if (invalid.length) return setMessage(`使えない文字があります: ${[...new Set(invalid)].join(' ')}`);
  const len = selected.cells.length;
  selected.cells.forEach(([r, c], i) => {
    if (revealed[r][c]) return;
    if (i < letters.length) filled[r][c] = letters[i];
  });
  save();
  render();
  if (isSolved()) return finish();
  if (letters.length !== len) {
    setMessage(`${len}文字の答えです（${letters.length}文字入力されました）。`);
  } else {
    setMessage('');
    selectNextEmpty();
  }
}

function selectNextEmpty() {
  const start = selected ? selected.index + 1 : 0;
  for (let k = 0; k < words.length; k++) {
    const w = words[(start + k) % words.length];
    if (w.cells.some(([r, c]) => !filled[r][c])) return select(w);
  }
}

function clearWrong() {
  for (const row of cellEls) for (const el of row) el?.classList.remove('wrong');
}

function check() {
  clearWrong();
  let wrong = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (filled[r][c] && filled[r][c] !== solution[r][c]) {
        cellEls[r][c].classList.add('wrong');
        wrong++;
      }
    }
  }
  setMessage(wrong ? `まちがいが ${wrong} マスあります。` : 'いまのところ、まちがいはありません。');
}

function reveal(targets) {
  for (const w of targets) if (!shownWords.includes(w.index)) shownWords.push(w.index);
  const cells = targets.flatMap((w) => w.cells);
  for (const [r, c] of cells) {
    if (filled[r][c] !== solution[r][c]) revealed[r][c] = true;
    filled[r][c] = solution[r][c];
  }
  save();
  clearWrong();
  render();
}

function isSolved() {
  return solution.every((row, r) => row.every((ch, c) => ch === '#' || filled[r][c] === ch));
}

function finish() {
  const usedReveal = shownWords.length > 0;
  setMessage(usedReveal ? '全部うまりました。' : '完成！ おめでとうございます。');
}

function setMessage(text) {
  document.getElementById('message').textContent = text;
}

// ---- 開始 ----
document.getElementById('title').textContent = `${PUZZLE.date} のクロスワード`;
document.getElementById('theme').textContent = `テーマ: ${PUZZLE.title}`;
const rulesEl = document.getElementById('rules');
for (const text of [...PUZZLE.rules, ...rules]) {
  const li = document.createElement('li');
  li.textContent = text;
  rulesEl.append(li);
}
document.getElementById('form').addEventListener('submit', (e) => {
  e.preventDefault();
  enter(document.getElementById('answer').value);
});
document.getElementById('check').addEventListener('click', check);
document.getElementById('reveal-word').addEventListener('click', () => {
  if (!selected) return setMessage('先にカギを選んでください。');
  reveal([selected]);
  setMessage('');
});
document.getElementById('reveal-all').addEventListener('click', () => {
  if (!confirm('全部の答えを表示しますか？')) return;
  reveal(words);
  setMessage('全部の答えを表示しました。');
});
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('入力をすべて消しますか？')) return;
  filled = emptyGrid();
  revealed = emptyGrid(false);
  shownWords = [];
  save();
  clearWrong();
  setMessage('');
  render();
});

buildBoard();
buildClues();
load();
render();
if (isSolved()) finish();
</script>
</body>
</html>
