<html lang="ja">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>単語帳｜__SITE_NAME__</title>
<meta name="description" content="__SITE_NAME__の単語帳。ジャンルごとに、クロスワードに出る言葉とカギ・解説をまとめています。">
<!--__HEAD_META__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/*__BASE_CSS__*/
  .cards { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 14px; }
  @media (min-width: 760px) { .cards { grid-template-columns: 1fr 1fr; } }
  .card { display: flex; gap: 14px; padding: 12px; color: inherit; text-decoration: none; background: rgba(244, 237, 224, .55); border: 1px solid var(--rule); }
  .card:hover { background: var(--paper); }
  .card img { flex: none; width: 88px; height: 88px; object-fit: cover; background: var(--paper); box-shadow: 0 2px 8px rgba(46, 39, 33, .2); }
  .card .title { margin: 0; font-weight: 700; }
  .card .en { margin: 0; font-family: var(--latin); font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .card .meta { margin: 4px 0 0; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<!--__HEADER__-->
<main>
  <div class="hero">
    <h1>単語帳</h1>
    <p class="subtitle">Word Lists</p>
    <p class="description">クロスワードに出る言葉を、ジャンルごとにまとめました。それぞれの言葉のカギと解説を読むことができます。</p>
  </div>
<!--__CARDS__-->
</main>
<!--__FOOTER__-->
