<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バックナンバー｜__SITE_NAME__</title>
<meta name="description" content="__SITE_NAME__のバックナンバー。これまでのクロスワードパズルをテーマごとに一覧できます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Shippori+Mincho:wght@500;700;800&display=swap">
<style>
/*__BASE_CSS__*/
  h2.section { font-size: 1.15rem; letter-spacing: .2em; margin: 32px 0 12px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
  h2.section .en { margin-left: 10px; font-family: var(--latin); font-size: .9rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .genre { margin: 0 0 12px; font-size: .9rem; line-height: 1.9; }
  .genre a { color: var(--fg); }
  .cards { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
  @media (min-width: 760px) { .cards { grid-template-columns: 1fr 1fr; } }
  .card { display: flex; gap: 14px; padding: 12px; color: inherit; text-decoration: none; background: rgba(244, 237, 224, .55); border: 1px solid var(--rule); }
  .card:hover { background: var(--paper); }
  .card img { flex: none; width: 88px; height: 88px; object-fit: cover; background: var(--paper); box-shadow: 0 2px 8px rgba(46, 39, 33, .2); }
  .card .meta { min-width: 0; }
  .card .date { margin: 0; color: var(--muted); font-size: .8rem; letter-spacing: .1em; }
  .card .title { margin: 0; font-weight: 700; line-height: 1.5; }
  .card .round { margin-left: 6px; color: var(--accent); font-size: .85em; letter-spacing: .2em; white-space: nowrap; }
  .card .desc { margin: 4px 0 0; font-size: .85rem; line-height: 1.7; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .status { display: inline-block; margin-left: 6px; padding: 0 8px; border: 1px solid var(--muted); border-radius: 999px; font-size: .7rem; letter-spacing: .1em; color: var(--muted); vertical-align: .1em; }
  .card .status:empty { display: none; }
  .card .status.solved { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<!--__HEADER__-->
<main>
  <div class="hero">
    <h1>バックナンバー</h1>
    <p class="subtitle">Archive</p>
    <p class="description">これまでのクロスワードパズルを、テーマごとにまとめました。この端末で解いたものには「完成」、解きかけのものには「途中」の印がつきます。</p>
  </div>
  <h2 class="section">新着<span class="en">Latest</span></h2>
<!--__LATEST__-->
<!--__THEMES__-->
</main>
<!--__FOOTER__-->
<script>
// この端末での進み具合（パズルのページが localStorage に保存したもの）
for (const card of document.querySelectorAll('.card[data-id]')) {
  try {
    const data = JSON.parse(localStorage.getItem(`xword:${card.dataset.id}`) ?? 'null');
    const status = card.querySelector('.status');
    if (data?.solved) {
      status.textContent = '完成';
      status.classList.add('solved');
    } else if (data?.started ?? data?.filled?.flat().some(Boolean)) {
      status.textContent = '途中';
    }
  } catch {}
}
</script>
</body>
</html>
