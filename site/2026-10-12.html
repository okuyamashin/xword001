<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クロスワード 2026-10-12｜世界の国と地域</title>
<style>
  :root {
    --bg: #fff;
    --fg: #222;
    --muted: #666;
    --line: #333;
    --block: transparent;
    --cell: #fff;
    --word: #fff3b0;
    --active: #ffd23f;
    --wrong: #ffb3b3;
    --revealed: #2a6fdb;
    --accent: #2a6fdb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .theme { color: var(--muted); margin: 0 0 12px; }
  .layout { display: grid; gap: 16px; }
  @media (min-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr) 320px; } }

  .board {
    display: block;
    width: min(100%, 520px);
    height: auto;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .board .cell { cursor: pointer; }
  .board .cell rect { fill: var(--cell); stroke: var(--line); stroke-width: 1; }
  .board .cell.in-word rect { fill: var(--word); }
  .board .cell.active rect { fill: var(--active); }
  .board .cell.wrong rect { fill: var(--wrong); }
  .board .num { font-size: 10px; fill: var(--muted); }
  .board .letter { font-size: 24px; fill: var(--fg); text-anchor: middle; dominant-baseline: central; }
  .board .cell.revealed .letter { fill: var(--revealed); }

  .entry { margin-top: 12px; width: min(100%, 520px); }
  .current { min-height: 4.5em; margin: 0 0 8px; }
  .current .label { font-weight: bold; }
  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; min-width: 0; font-size: 1.1rem; padding: 8px; }
  button { font-size: 1rem; padding: 8px 12px; cursor: pointer; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .message { min-height: 3em; margin: 8px 0 0; color: var(--accent); font-weight: bold; }

  .clues h2 { font-size: 1rem; margin: 0 0 4px; }
  .clues ol { list-style: none; padding: 0; margin: 0 0 16px; }
  .clues li { padding: 4px 6px; cursor: pointer; border-radius: 4px; }
  .clues li.selected { background: var(--word); }
  .clues li.done { color: var(--muted); }
  .clues li.wrong { background: var(--wrong); color: var(--fg); }
  .clues li .n { font-weight: bold; margin-right: 4px; }
  .clues li .ans { color: var(--revealed); margin-left: 4px; }
  .clues li .explain { display: none; margin: 4px 0 2px; font-size: 0.9rem; color: var(--fg); }
  .explained .clues li .explain { display: block; }
  .clues li .tag[hidden] { display: none; }
  .clues li .tag { display: inline-block; margin-right: 6px; padding: 0 6px; border: 1px solid var(--muted); border-radius: 999px; font-size: 0.75rem; color: var(--muted); }

  .rules { margin-top: 16px; font-size: 0.9rem; color: var(--muted); }
  .rules ul { padding-left: 1.2em; margin: 4px 0; }
</style>
</head>
<body>
<main id="main">
  <h1 id="title"></h1>
  <p class="theme" id="theme"></p>
  <div class="layout">
    <section>
      <svg class="board" id="board" role="img" aria-label="クロスワードの盤面"></svg>
      <div class="entry">
        <p class="current" id="current">カギを選んでください。</p>
        <form class="input-row" id="form" autocomplete="off">
          <input id="answer" type="text" inputmode="text" placeholder="答えを入力" aria-label="答え">
          <button type="submit">入れる</button>
        </form>
        <div class="buttons">
          <button type="button" id="check">答え合わせ</button>
          <button type="button" id="reveal-word">この答えを見る</button>
          <button type="button" id="reveal-all">全部の答えを見る</button>
          <button type="button" id="reset">リセット</button>
        </div>
        <p class="message" id="message" role="status"></p>
      </div>
    </section>
    <section class="clues">
      <h2 id="across-label"></h2>
      <ol id="across"></ol>
      <h2 id="down-label"></h2>
      <ol id="down"></ol>
    </section>
  </div>
  <section class="rules">
    <strong>答えの書き方</strong>
    <ul id="rules"></ul>
  </section>
</main>

<script>
// ---- 言語ごとの設定（generator/locales/<locale>.js を埋め込む） ----
// 日本語の文字ルール（全体のルール）

const SMALL = Object.fromEntries(
  [...'ァィゥェォッャュョヮヵヶ'].map((c, i) => [c, 'アイウエオツヤユヨワカケ'[i]]),
);
const VU = [['ヴァ', 'バ'], ['ヴィ', 'ビ'], ['ヴェ', 'ベ'], ['ヴォ', 'ボ'], ['ヴ', 'ブ']];

const locale = 'ja';

const labels = { across: 'ヨコ', down: 'タテ' };

const rules = [
  '答えはカタカナで、1マスに1文字入ります（ひらがなで入力してもかまいません）',
  '小さい文字は大きい文字で入れます（例: シャツ → シヤツ）',
  '濁点・半濁点のついた文字は1文字です（例: ガ は1マス）',
  '「ヴ」は使わず、バ行で表します（例: ヴァイオリン → バイオリン）',
  '長音「ー」は1文字です',
];

// 入力やリストの文字列を、マスに入る形にそろえる
function normalize(text) {
  let s = [...text.normalize('NFKC')]
    .map((c) => (c >= 'ぁ' && c <= 'ゖ' ? String.fromCodePoint(c.codePointAt(0) + 0x60) : c))
    .join('');
  for (const [from, to] of VU) s = s.replaceAll(from, to);
  s = [...s].map((c) => SMALL[c] ?? c).join('');
  return s.replace(/[・\s]/g, '');
}

function isValidAnswer(answer) {
  return /^[ア-ンー]+$/.test(answer) && !/[ァィゥェォッャュョヮヵヶヴ]/.test(answer);
}

// ヒント生成の標準設定（テーマファイルの clue で上書きできる）
const clueDefaults = {
  maxLength: 40,
  instructions: [
    'クロスワードパズルのカギ（ヒント）を日本語で書く。',
    '1つのカギは短い1〜2文で書く。です・ます調にしない（「〜の国」「〜するもの」のような体言止めか常体）。',
    '答えの言葉そのもの、答えの漢字、答えの一部をカギに含めない。',
    'カギだけを読んで、答えが1つに絞れるようにする。',
    '事実として確かなことだけを書く。自信がないことは書かない。',
  ],
};

// 解説生成の標準設定（テーマファイルの explanation で上書きできる）
// 解説は、完成したとき・全部の答えを見たときに表示する
const explanationDefaults = {
  maxLength: 120,
  instructions: [
    'クロスワードパズルを解き終えた人が読む、答えの言葉の短い解説を日本語で書く。',
    '2〜3文で、です・ます調で書く。',
    '「へえ」と思える豆知識を1つ入れる。カギと同じ内容をくり返さない。',
    '事実として確かなことだけを書く。自信がないことは書かない。',
  ],
};

// 解説の欄で、テーマ外の「つなぎの言葉」につける印
const fillerLabel = 'つなぎの言葉';

// カギに答えが漏れていないかを調べる
function leaksAnswer(clue, word) {
  const text = normalize(clue);
  if (text.includes(word.answer)) return `カギに答え「${word.answer}」が含まれている`;
  if (word.display && clue.includes(word.display)) return `カギに表記「${word.display}」が含まれている`;
  return null;
}


// ---- パズル ----
const PUZZLE = {"id":"2026-10-12-ja","date":"2026-10-12","locale":"ja","theme":"countries","title":"世界の国と地域","rules":["国名は略称で答えてください（例: アメリカ合衆国 → アメリカ）","国ではない地域（台湾・香港など）も含みます"],"size":{"rows":9,"cols":9},"grid":["#タイ###キ##","キ#タジキスタン#","プ#リ#タ#マ#グ","ロシア#チ#ケニア","ス###ヨ#ド#ム","#セキドウギニア#","##ユ#セ#ア##","#ポーランド#マ#","##バ##アメリカ"],"words":[{"number":1,"direction":"across","row":0,"col":1,"answer":"タイ","display":"タイ","theme":"countries","clue":"首都はバンコクの東南アジアの国","explanation":"国土は南北に長く、熱帯の気候が広がります。仏教寺院が多く、国民の多くが上座部仏教を信仰しています。"},{"number":5,"direction":"across","row":1,"col":2,"answer":"タジキスタン","display":"タジキスタン","theme":"countries","clue":"首都はドゥシャンベの中央アジアの国","explanation":"国土の9割以上が山地で、パミール高原の一部があります。国名は「タジク人の国」という意味です。"},{"number":8,"direction":"across","row":3,"col":0,"answer":"ロシア","display":"ロシア","theme":"countries","clue":"モスクワが首都の世界最大面積の国","explanation":"ヨーロッパとアジアにまたがり、11の時間帯があります。シベリア鉄道は世界最長級の鉄道路線として知られます。"},{"number":9,"direction":"across","row":3,"col":6,"answer":"ケニア","display":"ケニア","theme":"countries","clue":"ナイロビを首都とする東アフリカの国","explanation":"赤道が国土を通り、サバンナや高地など多様な自然があります。スワヒリ語と英語が公用語です。"},{"number":10,"direction":"across","row":5,"col":1,"answer":"セキドウギニア","display":"赤道ギニア","theme":"countries","clue":"首都はマラボ。公用語はスペイン語","explanation":"大陸部と島々からなり、ビオコ島に主要都市マラボがあります。アフリカでスペイン語が公用語の珍しい国です。"},{"number":12,"direction":"across","row":7,"col":1,"answer":"ポーランド","display":"ポーランド","theme":"countries","clue":"首都はワルシャワの中欧の国","explanation":"バルト海に面し、琥珀の産地として古くから知られます。作曲家ショパンの生地としても有名です。"},{"number":15,"direction":"across","row":8,"col":5,"answer":"アメリカ","display":"アメリカ","theme":"countries","clue":"首都はワシントンD.C.の北米の国","explanation":"50の州と首都ワシントンD.C.からなる連邦国家です。星条旗の星の数は州の数と同じ50個です。"},{"number":2,"direction":"down","row":0,"col":2,"answer":"イタリア","display":"イタリア","theme":"countries","clue":"ローマを首都とする長靴形の半島の国","explanation":"国内にバチカン市国とサンマリノという独立国を囲んでいます。世界遺産の登録数が特に多い国です。"},{"number":3,"direction":"down","row":0,"col":6,"answer":"キタマケドニア","display":"北マケドニア","theme":"countries","clue":"首都はスコピエ。バルカン半島の内陸国","explanation":"ギリシャとの国名をめぐる対立を解決するため、2019年に「マケドニア」から国名を改めました。オフリド湖は世界遺産です。"},{"number":4,"direction":"down","row":1,"col":0,"answer":"キプロス","display":"キプロス","theme":"countries","clue":"首都はニコシア、地中海東部の島国","explanation":"欧州連合に加盟していますが、地理的には西アジアに近い島です。銅の英語名copperはこの島名に由来します。"},{"number":6,"direction":"down","row":1,"col":4,"answer":"キタチヨウセン","display":"北朝鮮","theme":"countries","clue":"首都は平壌。日本は国家承認せず","explanation":"正式名称は朝鮮民主主義人民共和国です。国連には1991年に韓国と同時に加盟しました。"},{"number":7,"direction":"down","row":2,"col":8,"answer":"グアム","display":"グアム","theme":"countries","clue":"ハガニアを主都とする太平洋の米国準州","explanation":"アメリカの準州で、住民は米国市民です。ただし大統領選挙の本選には投票できません。"},{"number":11,"direction":"down","row":5,"col":2,"answer":"キユーバ","display":"キューバ","theme":"countries","clue":"首都はハバナ。カリブ海の島国","explanation":"カリブ海最大の島国で、砂糖や葉巻で知られます。音楽ではソンやルンバが世界に広まりました。"},{"number":13,"direction":"down","row":7,"col":5,"answer":"ドア","display":"ドア","theme":"general","clue":"部屋や家の出入り口にある開け閉めする板","explanation":"ドアは英語のdoorから来た外来語です。回転ドアは英語でrevolving doorといいます。"},{"number":14,"direction":"down","row":7,"col":7,"answer":"マリ","display":"マリ","theme":"countries","clue":"首都はバマコの西アフリカ内陸国","explanation":"ニジェール川が国土を流れ、古都トンブクトゥは交易と学問の中心でした。サハラ砂漠の南縁に位置します。"}]};

// ---- 状態 ----
const { rows, cols } = PUZZLE.size;
const solution = PUZZLE.grid.map((row) => [...row]);
const words = PUZZLE.words.map((w, i) => ({ ...w, index: i, cells: cellsOf(w) }));
const storageKey = `xword:${PUZZLE.id}`;
let filled = emptyGrid();
let revealed = emptyGrid(false);
let shownWords = []; // 答えを見た単語の index
let selected = null;
let activeCell = null;
let checkRequested = false; // 「答え合わせ」を押した直後だけ true（次の入力で戻す）

function emptyGrid(value = '') {
  return Array.from({ length: rows }, () => Array(cols).fill(value));
}
function cellsOf(w) {
  const [dr, dc] = w.direction === 'across' ? [0, 1] : [1, 0];
  return [...w.answer].map((_, i) => [w.row + dr * i, w.col + dc * i]);
}
function wordsAt(r, c) {
  return words.filter((w) => w.cells.some(([wr, wc]) => wr === r && wc === c));
}

// ---- 保存 ----
function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify({ filled, revealed, shownWords }));
  } catch {}
}
function load() {
  try {
    const data = JSON.parse(localStorage.getItem(storageKey) ?? 'null');
    if (data?.filled?.length === rows) {
      filled = data.filled;
      revealed = data.revealed;
      shownWords = data.shownWords ?? [];
    }
  } catch {}
}

// ---- 描画 ----
// 盤面は SVG。マスの大きさを座標で固定し、render() のたびにまるごと描き直す。
const board = document.getElementById('board');
const CELL = 40; // 1マスの大きさ（viewBox の単位）
const PAD = 1; // 外枠の線が切れないための余白
const numbers = new Map(words.map((w) => [`${w.row},${w.col}`, w.number]));
const mainThemes = PUZZLE.theme.split('+');

function buildBoard() {
  board.setAttribute('viewBox', `${-PAD} ${-PAD} ${cols * CELL + PAD * 2} ${rows * CELL + PAD * 2}`);
  board.addEventListener('click', (e) => {
    const cell = e.target.closest('[data-r]');
    if (cell) onCellClick(Number(cell.dataset.r), Number(cell.dataset.c));
  });
}

function boardSvg({ selectedCells, isWrong }) {
  const parts = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (solution[r][c] === '#') continue;
      const x = c * CELL;
      const y = r * CELL;
      const cls = ['cell'];
      if (selectedCells.has(`${r},${c}`)) cls.push('in-word');
      if (activeCell?.[0] === r && activeCell?.[1] === c) cls.push('active');
      if (isWrong(r, c)) cls.push('wrong');
      if (revealed[r][c]) cls.push('revealed');
      const num = numbers.get(`${r},${c}`);
      parts.push(
        `<g class="${cls.join(' ')}" data-r="${r}" data-c="${c}">` +
          `<rect x="${x}" y="${y}" width="${CELL}" height="${CELL}"/>` +
          (num ? `<text class="num" x="${x + 3}" y="${y + 10}">${num}</text>` : '') +
          (filled[r][c] ? `<text class="letter" x="${x + CELL / 2}" y="${y + CELL / 2 + 2}">${filled[r][c]}</text>` : '') +
          '</g>',
      );
    }
  }
  return parts.join('');
}

function buildClues() {
  document.getElementById('across-label').textContent = labels.across;
  document.getElementById('down-label').textContent = labels.down;
  for (const w of words) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${w.number}</span><span class="text"></span><span class="ans"></span>` +
      '<div class="explain"><span class="tag" hidden></span><span class="body"></span></div>';
    li.querySelector('.text').textContent = w.clue ?? '（カギなし）';
    li.querySelector('.body').textContent = w.explanation ?? '';
    // テーマ外の「つなぎの言葉」には印をつける
    if (!mainThemes.includes(w.theme)) {
      const tag = li.querySelector('.tag');
      tag.textContent = fillerLabel;
      tag.hidden = false;
    }
    li.addEventListener('click', () => select(w));
    document.getElementById(w.direction).append(li);
    w.li = li;
  }
}

function render() {
  const selectedCells = new Set(selected?.cells.map(([r, c]) => `${r},${c}`));
  // 全部埋まったとき、または答え合わせを押したときは、まちがいに色をつける
  const showWrong = checkRequested || allFilled();
  const isWrong = (r, c) => showWrong && filled[r][c] && filled[r][c] !== solution[r][c];
  board.innerHTML = boardSvg({ selectedCells, isWrong });
  // 完成したとき・全部の答えを見たときは、解説を出す
  const explained = isSolved() || words.every((w) => shownWords.includes(w.index));
  document.getElementById('main').classList.toggle('explained', explained);
  for (const w of words) {
    w.li.classList.toggle('selected', w === selected);
    const complete = w.cells.every(([r, c]) => filled[r][c]);
    w.li.classList.toggle('done', complete);
    w.li.classList.toggle('wrong', w.cells.some(([r, c]) => isWrong(r, c)));
    const shown = explained || shownWords.includes(w.index);
    w.li.querySelector('.ans').textContent = shown ? `→ ${w.display}` : '';
  }
  const current = document.getElementById('current');
  if (selected) {
    current.innerHTML = '<span class="label"></span> <span class="text"></span>';
    current.querySelector('.label').textContent = `${labels[selected.direction]}${selected.number}（${selected.cells.length}文字）`;
    current.querySelector('.text').textContent = selected.clue ?? '';
  }
}

// ---- 操作 ----
function select(w, cell = null) {
  selected = w;
  activeCell = cell ?? w.cells[0];
  if (!allFilled()) setMessage('');
  render();
  const input = document.getElementById('answer');
  input.value = w.cells.map(([r, c]) => filled[r][c] || '').join('');
  input.focus();
  input.select();
}

function onCellClick(r, c) {
  const candidates = wordsAt(r, c);
  if (!candidates.length) return;
  // 同じマスをもう一度押したら、タテとヨコを切り替える
  const sameCell = activeCell?.[0] === r && activeCell?.[1] === c;
  let next = candidates[0];
  if (sameCell && selected && candidates.length > 1) {
    next = candidates.find((w) => w !== selected) ?? next;
  } else if (selected && candidates.includes(selected)) {
    next = selected;
  }
  select(next, [r, c]);
}

function enter(text) {
  if (!selected) return setMessage('先にカギを選んでください。');
  const letters = [...normalize(text)];
  const invalid = letters.filter((ch) => !isValidAnswer(ch));
  if (invalid.length) return setMessage(`使えない文字があります: ${[...new Set(invalid)].join(' ')}`);
  const len = selected.cells.length;
  selected.cells.forEach(([r, c], i) => {
    if (revealed[r][c]) return;
    if (i < letters.length) filled[r][c] = letters[i];
  });
  checkRequested = false;
  save();
  render();
  if (allFilled()) return judge();
  if (letters.length !== len) {
    setMessage(`${len}文字の答えです（${letters.length}文字入力されました）。`);
  } else {
    setMessage('');
    selectNextEmpty();
  }
}

function selectNextEmpty() {
  const start = selected ? selected.index + 1 : 0;
  for (let k = 0; k < words.length; k++) {
    const w = words[(start + k) % words.length];
    if (w.cells.some(([r, c]) => !filled[r][c])) return select(w);
  }
}

function allFilled() {
  return solution.every((row, r) => row.every((ch, c) => ch === '#' || filled[r][c]));
}

function wrongWords() {
  return words.filter((w) => w.cells.some(([r, c]) => filled[r][c] && filled[r][c] !== solution[r][c]));
}

// 全部埋まったときの判定
function judge() {
  if (isSolved()) return finish();
  setMessage(`間違いがあります（${wrongWords().length}語）。赤いカギを見直してください。`);
}

function check() {
  checkRequested = true;
  render();
  if (allFilled()) return judge();
  const n = wrongWords().length;
  setMessage(n ? `間違いがあります（${n}語）。赤いカギを見直してください。` : 'いまのところ、間違いはありません。');
}

function reveal(targets) {
  for (const w of targets) if (!shownWords.includes(w.index)) shownWords.push(w.index);
  const cells = targets.flatMap((w) => w.cells);
  for (const [r, c] of cells) {
    if (filled[r][c] !== solution[r][c]) revealed[r][c] = true;
    filled[r][c] = solution[r][c];
  }
  save();
  render();
}

function isSolved() {
  return solution.every((row, r) => row.every((ch, c) => ch === '#' || filled[r][c] === ch));
}

function finish() {
  const usedReveal = shownWords.length > 0;
  setMessage(usedReveal ? '全部うまりました。カギの下に解説を出しました。' : '完成！ おめでとうございます。カギの下に解説を出しました。');
}

function setMessage(text) {
  document.getElementById('message').textContent = text;
}

// ---- 開始 ----
document.getElementById('title').textContent = `${PUZZLE.date} のクロスワード`;
document.getElementById('theme').textContent = `テーマ: ${PUZZLE.title}`;
const rulesEl = document.getElementById('rules');
for (const text of [...PUZZLE.rules, ...rules]) {
  const li = document.createElement('li');
  li.textContent = text;
  rulesEl.append(li);
}
document.getElementById('form').addEventListener('submit', (e) => {
  e.preventDefault();
  enter(document.getElementById('answer').value);
});
document.getElementById('check').addEventListener('click', check);
document.getElementById('reveal-word').addEventListener('click', () => {
  if (!selected) return setMessage('先にカギを選んでください。');
  reveal([selected]);
  if (allFilled()) judge();
  else setMessage('');
});
document.getElementById('reveal-all').addEventListener('click', () => {
  if (!confirm('全部の答えを表示しますか？')) return;
  reveal(words);
  setMessage('全部の答えを表示しました。カギの下に解説を出しました。');
});
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('入力をすべて消しますか？')) return;
  filled = emptyGrid();
  revealed = emptyGrid(false);
  shownWords = [];
  checkRequested = false;
  save();
  setMessage('');
  render();
});

buildBoard();
buildClues();
load();
render();
if (allFilled()) judge();
</script>
</body>
</html>
